<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Training Results | Admin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #16294b;
      background: #f7f5f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 22px max(24px, calc((100% - 1080px) / 2)); color: white; background: #16294b; }
    header p { margin: 0 0 5px; color: #e3c57d; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    header h1 { margin: 0; font-size: 22px; }
    main { width: min(1080px, calc(100% - 32px)); margin: 34px auto; }
    .card { max-width: 390px; margin: 8vh auto; padding: 24px; border: 1px solid #e4dfd3; border-radius: 10px; background: white; }
    label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
    input { width: 100%; margin-bottom: 14px; padding: 11px 12px; border: 1px solid #c9c4b8; border-radius: 6px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; color: white; background: #16294b; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { border: 1px solid #d4cebf; color: #16294b; background: white; }
    .login button { width: 100%; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat { min-width: 140px; padding: 13px 16px; border: 1px solid #e4dfd3; border-radius: 8px; background: white; font-size: 13px; }
    .stat strong { display: block; margin-top: 4px; font-size: 19px; }
    .message { margin: 10px 0 0; color: #a6362f; font-size: 13px; }
    .muted { color: #6b7280; }
    .table-wrap { overflow-x: auto; border: 1px solid #e4dfd3; border-radius: 8px; background: white; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 11px 13px; border-bottom: 1px solid #e4dfd3; text-align: left; font-size: 13px; }
    th { color: #6b7280; background: #faf8f3; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      header { padding: 18px 16px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .stat { flex: 1; min-width: 120px; }
    }
  </style>
</head>
<body>
  <header>
    <p>BrokerFlow CRM · Training Sandbox</p>
    <h1>Practice results · Admin</h1>
  </header>
  <main>
    <section class="card login" id="loginCard">
      <h2>Admin sign in</h2>
      <form id="loginForm">
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="loginButton">View results</button>
        <p class="message" id="loginMessage" role="alert" hidden></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="toolbar">
        <p class="muted">Latest 500 submissions. Results are not publicly accessible.</p>
        <div>
          <button class="secondary" id="refreshButton" type="button">Refresh</button>
          <button class="secondary" id="logoutButton" type="button">Log out</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div id="results" class="muted">Enter the admin password to load results.</div>
    </section>
  </main>
  <script>
    const passwordKey = "trainingSandboxAdminPassword";
    const loginCard = document.getElementById("loginCard");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const loginButton = document.getElementById("loginButton");
    const dashboard = document.getElementById("dashboard");
    const stats = document.getElementById("stats");
    const results = document.getElementById("results");

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      return `${String(minutes).padStart(2, "0")}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    }

    function cell(row, value) {
      const element = document.createElement("td");
      element.textContent = value;
      row.appendChild(element);
    }

    function renderAttempts(attempts) {
      stats.replaceChildren();
      results.replaceChildren();
      if (!attempts.length) {
        results.textContent = "No attempts have been submitted yet.";
        return;
      }

      const average = attempts.reduce((sum, attempt) => sum + attempt.accuracy_pct, 0) / attempts.length;
      [
        ["Attempts", String(attempts.length)],
        ["Average accuracy", `${average.toFixed(1)}%`],
        ["Perfect scores", String(attempts.filter((attempt) => attempt.accuracy_pct === 100).length)],
      ].forEach(([label, value]) => {
        const card = document.createElement("div");
        card.className = "stat";
        card.append(document.createTextNode(label));
        const strong = document.createElement("strong");
        strong.textContent = value;
        card.appendChild(strong);
        stats.appendChild(card);
      });

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headerRow = document.createElement("tr");
      ["Trainee", "Case", "Accuracy", "Time", "Submitted"].forEach((label) => {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      });
      head.appendChild(headerRow);
      table.appendChild(head);
      const body = document.createElement("tbody");
      attempts.forEach((attempt) => {
        const row = document.createElement("tr");
        cell(row, attempt.trainee_name || "Anonymous");
        cell(row, attempt.case_title);
        cell(row, `${attempt.accuracy_pct}%`);
        cell(row, formatTime(Number(attempt.time_seconds)));
        cell(row, new Date(attempt.submitted_at).toLocaleString());
        body.appendChild(row);
      });
      table.appendChild(body);
      wrapper.appendChild(table);
      results.appendChild(wrapper);
    }

    async function loadResults(password) {
      results.textContent = "Loading results…";
      try {
        const response = await fetch("/.netlify/functions/get-results", {
          headers: { "x-admin-password": password },
          cache: "no-store",
        });
        if (response.status === 401) {
          sessionStorage.removeItem(passwordKey);
          dashboard.hidden = true;
          loginCard.hidden = false;
          loginMessage.textContent = "Incorrect password.";
          loginMessage.hidden = false;
          return;
        }
        if (!response.ok) throw new Error(`Request failed (${response.status}).`);
        const { attempts } = await response.json();
        loginCard.hidden = true;
        dashboard.hidden = false;
        renderAttempts(attempts);
      } catch (error) {
        console.error("Could not load admin results:", error);
        results.textContent = "Could not load results. Check the Netlify function configuration and try again.";
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      loginButton.disabled = true;
      loginMessage.hidden = true;
      await loadResults(password);
      if (!loginCard.hidden) loginButton.disabled = false;
      else sessionStorage.setItem(passwordKey, password);
    });
    document.getElementById("refreshButton").addEventListener("click", () => {
      loadResults(sessionStorage.getItem(passwordKey) || "");
    });
    document.getElementById("logoutButton").addEventListener("click", () => {
      sessionStorage.removeItem(passwordKey);
      dashboard.hidden = true;
      loginCard.hidden = false;
      document.getElementById("password").value = "";
      loginMessage.hidden = true;
      loginButton.disabled = false;
    });

    const storedPassword = sessionStorage.getItem(passwordKey);
    if (storedPassword) loadResults(storedPassword);
  </script>
</body>
</html>
