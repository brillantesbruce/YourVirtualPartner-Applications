<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>YVP Results | Admin</title>
  <style>
    :root { font-family: Inter, "Segoe UI", sans-serif; color: #16294b; background: #f7f5f1; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 22px max(24px, calc((100% - 1180px) / 2)); color: white; background: #16294b; }
    header p { margin: 0 0 5px; color: #e3c57d; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    header h1 { margin: 0; font-size: 22px; }
    main { width: min(1180px, calc(100% - 32px)); margin: 30px auto; }
    .login { max-width: 390px; margin: 8vh auto; padding: 24px; border: 1px solid #e4dfd3; border-radius: 10px; background: white; }
    label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
    input, select { padding: 10px 12px; border: 1px solid #d6d0c3; border-radius: 6px; background: white; color: inherit; font: inherit; }
    input { width: 100%; margin-bottom: 14px; }
    .toolbar-actions input { width: min(250px, 100%); margin: 0; }
    .selection-toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0 0 12px; }
    .selection-toolbar input { width: auto; margin: 0; }
    .selection-toolbar button.danger { background: #a6362f; }
    .selection-count { margin-right: auto; font-size: 13px; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; color: white; background: #16294b; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    button.secondary { border: 1px solid #d6d0c3; color: #16294b; background: white; }
    .login button { width: 100%; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar-actions { display: flex; align-items: center; gap: 9px; }
    .stats, .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat, .source { padding: 13px 15px; border: 1px solid #e4dfd3; border-radius: 8px; background: white; font-size: 13px; }
    .stat strong { display: block; margin-top: 5px; font-size: 20px; }
    .source strong { display: block; margin-bottom: 4px; }
    .source.error { border-color: #d6a4a1; background: #fff9f8; }
    .muted { color: #6b7280; }
    .message { margin: 10px 0 0; color: #a6362f; font-size: 13px; }
    .action-message { margin: 10px 0 0; color: #176b3a; font-size: 13px; }
    .action-message.error { color: #a6362f; }
    .notice { margin: 12px 0; color: #7d4c17; font-size: 13px; }
    .table-wrap { overflow-x: auto; border: 1px solid #e4dfd3; border-radius: 8px; background: white; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e4dfd3; text-align: left; vertical-align: top; font-size: 13px; }
    th { position: sticky; top: 0; color: #6b7280; background: #faf8f3; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: 0; }
    .details-button { padding: 5px 8px; border: 1px solid #d6d0c3; color: #16294b; background: white; font-size: 12px; }
    .details td { background: #faf8f3; }
    .detail-summary { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 14px; font-size: 13px; }
    .detail-summary p { margin: 0; }
    .detail-summary strong { margin-right: 5px; }
    .detail-heading { margin: 12px 0 7px; font-size: 14px; }
    .review-table { min-width: 640px; border: 1px solid #e4dfd3; }
    .review-table th { position: static; }
    .review-table th, .review-table td { padding: 8px 10px; }
    .verdict-correct { color: #176b3a; font-weight: 600; }
    .verdict-incorrect { color: #a6362f; font-weight: 600; }
    .verdict-unanswered { color: #6b7280; }
    .select-cell { width: 42px; text-align: center; }
    .select-cell input { width: auto; margin: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      header { padding: 18px 16px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <p>Your Virtual Partner · Admin</p>
    <h1>Training &amp; Assessment Results</h1>
  </header>
  <main>
    <section class="login" id="login">
      <h2>Admin sign in</h2>
      <form id="loginForm">
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">View results</button>
        <p class="message" id="loginMessage" role="alert" hidden></p>
      </form>
    </section>
    <section id="dashboard" hidden>
      <div class="toolbar">
        <p class="muted">Showing up to 500 most recent submissions per app.</p>
        <div class="toolbar-actions">
          <label class="sr-only" for="resultSearch">Search candidate, app, or assessment</label>
          <input id="resultSearch" type="search" placeholder="Search name, app, assessment">
          <label for="appFilter">Filter</label>
          <select id="appFilter"><option value="all">All apps</option></select>
          <button class="secondary" id="refresh" type="button">Refresh</button>
          <button class="secondary" id="logout" type="button">Log out</button>
        </div>
        <div class="selection-toolbar" aria-label="Actions for selected results">
          <label class="select-cell"><input id="selectVisible" type="checkbox" aria-label="Select visible results"></label>
          <span class="muted">Select visible</span>
          <span class="selection-count" id="selectionCount" aria-live="polite">0 selected</span>
          <span class="muted">Delete up to 100 at a time.</span>
          <button class="secondary" id="exportSelected" type="button" disabled>Export selected CSV</button>
          <button class="secondary" id="printSelected" type="button" disabled>Print selected</button>
          <button class="danger" id="deleteSelected" type="button" disabled>Delete selected</button>
        </div>
        <p class="action-message" id="actionMessage" role="status" aria-live="polite" hidden></p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="sources" id="sources"></div>
      <p class="notice" id="partialNotice" hidden></p>
      <div id="results" class="muted">Loading results…</div>
    </section>
  </main>
  <script>
    const sessionKey = "yvpAdminPassword";
    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");
    const appFilter = document.getElementById("appFilter");
    const resultSearch = document.getElementById("resultSearch");
    let attempts = [];
    let sources = [];
    const selectedIds = new Set();

    function visibleAttempts() {
      const selectedApp = appFilter.value;
      const appFiltered = selectedApp === "all"
        ? attempts
        : attempts.filter((attempt) => attempt.appId === selectedApp);
      const query = resultSearch.value.trim().toLocaleLowerCase();
      return query
        ? appFiltered.filter((attempt) => [
          attempt.candidate,
          attempt.appName,
          attempt.assessment,
        ].some((value) => String(value || "").toLocaleLowerCase().includes(query)))
        : appFiltered;
    }

    function updateSelectionControls(visible) {
      const selectedCount = selectedIds.size;
      document.getElementById("selectionCount").textContent = `${selectedCount} selected`;
      document.getElementById("exportSelected").disabled = selectedCount === 0;
      document.getElementById("printSelected").disabled = selectedCount === 0;
      document.getElementById("deleteSelected").disabled = selectedCount === 0 || selectedCount > 100;
      const selectVisible = document.getElementById("selectVisible");
      const visibleSelected = visible.filter((attempt) => selectedIds.has(attempt.id)).length;
      selectVisible.checked = visible.length > 0 && visibleSelected === visible.length;
      selectVisible.indeterminate = visibleSelected > 0 && visibleSelected < visible.length;
      selectVisible.disabled = visible.length === 0;
    }

    function appendCell(row, content) {
      const cell = document.createElement("td");
      cell.textContent = content == null || content === "" ? "—" : String(content);
      row.appendChild(cell);
      return cell;
    }

    function formatDuration(seconds) {
      if (seconds == null || !Number.isFinite(Number(seconds))) return "—";
      const total = Math.round(Number(seconds));
      return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    function appendSummaryItem(container, label, value) {
      if (value == null || value === "") return;
      const item = document.createElement("p");
      const heading = document.createElement("strong");
      heading.textContent = `${label}:`;
      item.append(heading, document.createTextNode(String(value)));
      container.appendChild(item);
    }

    function renderAnswerTable(appId, answers) {
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      const table = document.createElement("table");
      table.className = "review-table";
      const header = document.createElement("thead");
      const headerRow = document.createElement("tr");
      const broker = appId === "broker-support-assessment";
      (broker
        ? ["Question", "Topic", "Candidate response", "Marks"]
        : ["Q", "Topic", "Candidate", "Correct", "Result", "Time"]
      ).forEach((label) => {
        const cell = document.createElement("th");
        cell.textContent = label;
        headerRow.appendChild(cell);
      });
      header.appendChild(headerRow);
      table.appendChild(header);

      const body = document.createElement("tbody");
      answers.forEach((answer) => {
        const row = document.createElement("tr");
        if (broker) {
          appendCell(row, answer.question || answer.number);
          appendCell(row, answer.topic);
          appendCell(row, answer.candidateAnswer);
          appendCell(row, `${Number(answer.earned || 0).toFixed(1)} / ${Number(answer.points || 0).toFixed(1)}`);
        } else {
          appendCell(row, answer.number);
          appendCell(row, answer.topic);
          appendCell(row, answer.candidateAnswer);
          appendCell(row, answer.correctAnswer);
          const resultCell = appendCell(row, answer.result);
          resultCell.className = answer.result === "Correct"
            ? "verdict-correct"
            : answer.result === "Unanswered" ? "verdict-unanswered" : "verdict-incorrect";
          appendCell(row, answer.timeSeconds == null ? "—" : `${answer.timeSeconds}s`);
        }
        body.appendChild(row);
      });
      table.appendChild(body);
      wrapper.appendChild(table);
      return wrapper;
    }

    function renderAttemptDetails(attempt, container) {
      const details = attempt.details || {};
      const summary = document.createElement("div");
      summary.className = "detail-summary";

      if (attempt.appId === "broker-support-assessment") {
        appendSummaryItem(summary, "Candidate role", details.candidate_role);
      } else if (attempt.appId === "bookkeeper-assessment") {
        appendSummaryItem(summary, "Score band", details.score_band);
      } else if (attempt.appId === "training-sandbox") {
        appendSummaryItem(summary, "Case ID", details.case_id);
      } else if (attempt.appId === "fpa-assessment") {
        appendSummaryItem(summary, "Candidate email", details.candidate_email);
        appendSummaryItem(summary, "Auto-submitted", details.auto_submitted ? "Yes" : "No");
      } else if (attempt.appId === "paraplanner-assessment") {
        appendSummaryItem(summary, "Score band", details.score_band);
        appendSummaryItem(summary, "Unanswered", details.unanswered_count);
        appendSummaryItem(summary, "Timing mode", details.timing_mode);
        appendSummaryItem(summary, "Auto-submitted", details.auto_submitted ? "Yes" : "No");
      }

      if (attempt.appId === "broker-support-assessment" && details.section_scores
        && typeof details.section_scores === "object") {
        const sectionScores = Object.entries(details.section_scores)
          .map(([section, score]) => `${section}: ${score}`)
          .join(" · ");
        appendSummaryItem(summary, "Section scores", sectionScores);
      }

      if (summary.childElementCount) container.appendChild(summary);

      if (details.note) {
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = details.note;
        container.appendChild(note);
      }

      if (Array.isArray(details.answers) && details.answers.length) {
        const heading = document.createElement("h3");
        heading.className = "detail-heading";
        heading.textContent = "Answer review";
        container.append(heading, renderAnswerTable(attempt.appId, details.answers));
      } else if (!details.note) {
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = "No answer-by-answer details were saved for this result.";
        container.appendChild(note);
      }
    }

    function render() {
      const filtered = visibleAttempts();
      updateSelectionControls(filtered);
      const successfulSources = sources.filter((source) => source.status === "ok");
      const average = filtered.length
        ? filtered.reduce((sum, attempt) => sum + attempt.percentage, 0) / filtered.length
        : 0;

      const stats = document.getElementById("stats");
      stats.replaceChildren();
      [
        ["Matching submissions", String(filtered.length)],
        ["Average score", filtered.length ? `${average.toFixed(1)}%` : "—"],
        ["Connected apps", `${successfulSources.length} / ${sources.length}`],
      ].forEach(([label, value]) => {
        const card = document.createElement("div");
        card.className = "stat";
        card.append(document.createTextNode(label));
        const strong = document.createElement("strong");
        strong.textContent = value;
        card.appendChild(strong);
        stats.appendChild(card);
      });

      const sourceCards = document.getElementById("sources");
      sourceCards.replaceChildren();
      sources.forEach((source) => {
        const card = document.createElement("div");
        card.className = `source${source.status === "ok" ? "" : " error"}`;
        const name = document.createElement("strong");
        name.textContent = source.name;
        const status = document.createElement("span");
        status.className = "muted";
        status.textContent = source.status === "ok"
          ? `${source.count} results loaded`
          : source.error;
        card.append(name, status);
        sourceCards.appendChild(card);
      });

      const failedSources = sources.filter((source) => source.status !== "ok");
      const partialNotice = document.getElementById("partialNotice");
      partialNotice.hidden = failedSources.length === 0;
      partialNotice.textContent = failedSources.length
        ? "Some apps could not be loaded; their results are not included below. Check their environment variables or database connection."
        : "";

      const results = document.getElementById("results");
      results.replaceChildren();
      if (!filtered.length) {
        results.textContent = successfulSources.length
          ? "No results to show for this selection."
          : "No app result sources are connected yet.";
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headerRow = document.createElement("tr");
      const selectHeader = document.createElement("th");
      selectHeader.className = "select-cell";
      selectHeader.textContent = "Select";
      headerRow.appendChild(selectHeader);
      ["Submitted", "App", "Candidate", "Assessment", "Score", "Outcome", "Time", "Details"].forEach((label) => {
        const cell = document.createElement("th");
        cell.textContent = label;
        headerRow.appendChild(cell);
      });
      head.appendChild(headerRow);
      table.appendChild(head);
      const body = document.createElement("tbody");
      filtered.forEach((attempt) => {
        const row = document.createElement("tr");
        const selectionCell = document.createElement("td");
        selectionCell.className = "select-cell";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selectedIds.has(attempt.id);
        checkbox.setAttribute("aria-label", `Select ${attempt.candidate} — ${attempt.assessment}`);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedIds.add(attempt.id);
          else selectedIds.delete(attempt.id);
          updateSelectionControls(visibleAttempts());
        });
        selectionCell.appendChild(checkbox);
        row.appendChild(selectionCell);
        appendCell(row, new Date(attempt.submittedAt).toLocaleString());
        appendCell(row, attempt.appName);
        appendCell(row, attempt.candidate);
        appendCell(row, attempt.assessment);
        appendCell(row, `${attempt.score}${Number.isFinite(attempt.percentage) ? ` (${attempt.percentage.toFixed(1)}%)` : ""}`);
        appendCell(row, attempt.outcome || "—");
        appendCell(row, formatDuration(attempt.durationSeconds));
        const detailsCell = appendCell(row, "");
        const detailsButton = document.createElement("button");
        detailsButton.type = "button";
        detailsButton.className = "details-button";
        detailsButton.textContent = "View";
        detailsCell.appendChild(detailsButton);
        body.appendChild(row);

        const detailsRow = document.createElement("tr");
        detailsRow.className = "details";
        detailsRow.hidden = true;
        const details = document.createElement("td");
        details.colSpan = 9;
        renderAttemptDetails(attempt, details);
        detailsRow.appendChild(details);
        detailsButton.addEventListener("click", () => {
          detailsRow.hidden = !detailsRow.hidden;
          detailsButton.textContent = detailsRow.hidden ? "View" : "Hide";
        });
        body.appendChild(detailsRow);
      });
      table.appendChild(body);
      wrapper.appendChild(table);
      results.appendChild(wrapper);
    }

    function selectedAttempts() {
      return attempts.filter((attempt) => selectedIds.has(attempt.id));
    }

    function csvCell(value) {
      let text = value == null ? "" : String(value);
      if (/^[\s]*[=+\-@]/.test(text)) text = `'${text}`;
      return `"${text.replace(/"/g, '""')}"`;
    }

    function exportSelected() {
      const selected = selectedAttempts();
      const headers = [
        "Submitted", "App", "Candidate", "Assessment", "Score", "Accuracy (%)",
        "Outcome", "Duration (seconds)", "Details",
      ];
      const rows = selected.map((attempt) => [
        attempt.submittedAt,
        attempt.appName,
        attempt.candidate,
        attempt.assessment,
        attempt.score,
        Number.isFinite(attempt.percentage) ? attempt.percentage : "",
        attempt.outcome,
        attempt.durationSeconds,
        JSON.stringify(attempt.details || {}),
      ]);
      const csv = [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `yvp-assessment-results-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function printSelected() {
      const selected = selectedAttempts();
      const printWindow = window.open("", "_blank");
      if (!printWindow) {
        document.getElementById("actionMessage").textContent = "Allow pop-ups to print the selected results.";
        document.getElementById("actionMessage").hidden = false;
        return;
      }
      printWindow.opener = null;

      printWindow.document.title = "Selected Assessment Results";
      const style = printWindow.document.createElement("style");
      style.textContent = `
        body { font-family: Arial, sans-serif; color: #16294b; margin: 24px; }
        h1 { font-size: 22px; } h2 { margin: 24px 0 8px; font-size: 18px; }
        .summary { display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:10px; font-size:13px; }
        .summary p { margin:0; } .summary strong { margin-right:5px; }
        table { border-collapse:collapse; width:100%; margin:8px 0 18px; }
        th,td { border:1px solid #bbb; padding:6px 8px; text-align:left; font-size:11px; vertical-align:top; }
        th { background:#f2f2f2; } .detail-heading { font-size:14px; }
        .verdict-correct { color:#176b3a; } .verdict-incorrect { color:#a6362f; }
        .verdict-unanswered,.muted { color:#666; }
        @media print { body { margin: 12mm; } h2 { break-after: avoid; } tr { break-inside: avoid; } }
      `;
      printWindow.document.head.appendChild(style);
      const heading = printWindow.document.createElement("h1");
      heading.textContent = "Assessment Results";
      printWindow.document.body.appendChild(heading);

      selected.forEach((attempt) => {
        const title = printWindow.document.createElement("h2");
        title.textContent = `${attempt.candidate} — ${attempt.assessment}`;
        printWindow.document.body.appendChild(title);
        const summary = printWindow.document.createElement("div");
        summary.className = "summary";
        [
          ["App", attempt.appName],
          ["Submitted", new Date(attempt.submittedAt).toLocaleString()],
          ["Score", attempt.score],
          ["Accuracy", Number.isFinite(attempt.percentage) ? `${attempt.percentage.toFixed(1)}%` : "—"],
          ["Outcome", attempt.outcome || "—"],
          ["Time", formatDuration(attempt.durationSeconds)],
        ].forEach(([label, value]) => appendSummaryItem(summary, label, value));
        printWindow.document.body.appendChild(printWindow.document.importNode(summary, true));
        const detailContainer = document.createElement("div");
        renderAttemptDetails(attempt, detailContainer);
        printWindow.document.body.appendChild(printWindow.document.importNode(detailContainer, true));
      });
      printWindow.focus();
      printWindow.print();
    }

    async function deleteSelected() {
      const selected = selectedAttempts();
      if (!selected.length) return;
      if (selected.length > 100) {
        const message = document.getElementById("actionMessage");
        message.textContent = "Delete at most 100 selected results at a time.";
        message.classList.add("error");
        message.hidden = false;
        return;
      }
      const listing = selected.slice(0, 10)
        .map((attempt) => `${attempt.candidate} — ${attempt.assessment} (${attempt.appName})`)
        .join("\n");
      const more = selected.length > 10 ? `\n…and ${selected.length - 10} more.` : "";
      const confirmation = `Permanently delete ${selected.length} selected result${selected.length === 1 ? "" : "s"} from the connected database${selected.length === 1 ? "" : "s"}?\n\n${listing}${more}\n\nThis cannot be undone.`;
      if (!window.confirm(confirmation)) return;

      const button = document.getElementById("deleteSelected");
      const message = document.getElementById("actionMessage");
      button.disabled = true;
      message.hidden = true;
      message.classList.remove("error");
      try {
        const response = await fetch("/.netlify/functions/delete-results", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": sessionStorage.getItem(sessionKey) || "",
          },
          body: JSON.stringify({
            records: selected.map((attempt) => ({ appId: attempt.appId, id: attempt.recordId })),
          }),
        });
        const result = await response.json();
        if (!response.ok && response.status !== 207) {
          throw new Error(result.error || `Delete request failed (${response.status}).`);
        }

        const deletedKeys = new Set(result.deleted.map((record) => `${record.appId}-${record.id}`));
        const deletedByApp = new Map();
        result.deleted.forEach(({ appId }) => {
          deletedByApp.set(appId, (deletedByApp.get(appId) || 0) + 1);
        });
        sources = sources.map((source) => ({
          ...source,
          count: typeof source.count === "number"
            ? Math.max(0, source.count - (deletedByApp.get(source.id) || 0))
            : source.count,
        }));
        attempts = attempts.filter((attempt) => !deletedKeys.has(attempt.id));
        deletedKeys.forEach((key) => selectedIds.delete(key));
        const failedCount = result.failedApps.length;
        message.textContent = failedCount
          ? `Deleted ${result.deleted.length} result(s); deletion failed for ${failedCount} app database(s). Refresh to review current data.`
          : `Deleted ${result.deleted.length} selected result(s).`;
        message.classList.toggle("error", failedCount > 0);
        message.hidden = false;
        render();
        if (failedCount) await loadResults(sessionStorage.getItem(sessionKey) || "");
      } catch (error) {
        console.error("Could not delete selected assessment results:", error);
        message.textContent = error.message || "Could not delete the selected results.";
        message.classList.add("error");
        message.hidden = false;
      } finally {
        button.disabled = selectedIds.size === 0;
      }
    }

    async function loadResults(password) {
      document.getElementById("results").textContent = "Loading results…";
      try {
        const response = await fetch("/.netlify/functions/get-results", {
          headers: { "x-admin-password": password },
          cache: "no-store",
        });
        if (response.status === 401) {
          sessionStorage.removeItem(sessionKey);
          selectedIds.clear();
          dashboard.hidden = true;
          login.hidden = false;
          loginMessage.textContent = "Incorrect admin password.";
          loginMessage.hidden = false;
          return false;
        }
        if (!response.ok) throw new Error(`Admin request failed (${response.status}).`);
        const result = await response.json();
        attempts = result.attempts;
        sources = result.apps;
        const currentFilter = appFilter.value;
        appFilter.replaceChildren(new Option("All apps", "all"));
        sources.forEach((source) => appFilter.add(new Option(source.name, source.id)));
        appFilter.value = sources.some((source) => source.id === currentFilter) ? currentFilter : "all";
        login.hidden = true;
        dashboard.hidden = false;
        render();
        return true;
      } catch (error) {
        console.error("Could not load admin results:", error);
        loginMessage.textContent = "Could not load results. Check the Netlify environment variables and try again.";
        loginMessage.hidden = false;
        document.getElementById("results").textContent = "Results could not be loaded.";
        return false;
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      loginButton.disabled = true;
      loginMessage.hidden = true;
      if (await loadResults(password)) sessionStorage.setItem(sessionKey, password);
      loginButton.disabled = false;
    });
    appFilter.addEventListener("change", render);
    resultSearch.addEventListener("input", render);
    document.getElementById("selectVisible").addEventListener("change", (event) => {
      visibleAttempts().forEach((attempt) => {
        if (event.target.checked) selectedIds.add(attempt.id);
        else selectedIds.delete(attempt.id);
      });
      render();
    });
    document.getElementById("exportSelected").addEventListener("click", exportSelected);
    document.getElementById("printSelected").addEventListener("click", printSelected);
    document.getElementById("deleteSelected").addEventListener("click", deleteSelected);
    document.getElementById("refresh").addEventListener("click", () => {
      loadResults(sessionStorage.getItem(sessionKey) || "");
    });
    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.removeItem(sessionKey);
      selectedIds.clear();
      attempts = [];
      sources = [];
      dashboard.hidden = true;
      login.hidden = false;
      document.getElementById("password").value = "";
      loginMessage.hidden = true;
    });

    const savedPassword = sessionStorage.getItem(sessionKey);
    if (savedPassword) loadResults(savedPassword);
  </script>
</body>
</html>
